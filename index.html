<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Калькулятор</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #dfe9f3, #ffffff);
      }

      .calculator {
        width: min(360px, 90vw);
        padding: 24px;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 20px 50px rgba(30, 40, 60, 0.15);
      }

      .display {
        background: #0f172a;
        color: #f8fafc;
        border-radius: 16px;
        padding: 20px;
        text-align: right;
        min-height: 110px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        overflow-wrap: anywhere;
      }

      .display .expression {
        font-size: 0.95rem;
        color: #cbd5f5;
        min-height: 22px;
      }

      .display .result {
        font-size: 2rem;
        font-weight: 600;
      }

      .keys {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }

      button {
        border: none;
        border-radius: 14px;
        padding: 16px;
        font-size: 1.1rem;
        font-weight: 600;
        background: #f1f5f9;
        color: #0f172a;
        cursor: pointer;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
      }

      button:active {
        transform: translateY(1px);
      }

      button.operator {
        background: #e0e7ff;
        color: #312e81;
      }

      button.equal {
        background: #38bdf8;
        color: #0f172a;
        grid-column: span 2;
      }

      button.clear {
        background: #fee2e2;
        color: #b91c1c;
      }

      button.zero {
        grid-column: span 2;
      }
    </style>
  </head>
  <body>
    <main class="calculator" aria-label="Калькулятор">
      <section class="display" aria-live="polite">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
      </section>
      <section class="keys">
        <button class="clear" data-action="clear">C</button>
        <button class="operator" data-action="delete">⌫</button>
        <button class="operator" data-action="percent">%</button>
        <button class="operator" data-action="operator">÷</button>

        <button data-action="number">7</button>
        <button data-action="number">8</button>
        <button data-action="number">9</button>
        <button class="operator" data-action="operator">×</button>

        <button data-action="number">4</button>
        <button data-action="number">5</button>
        <button data-action="number">6</button>
        <button class="operator" data-action="operator">−</button>

        <button data-action="number">1</button>
        <button data-action="number">2</button>
        <button data-action="number">3</button>
        <button class="operator" data-action="operator">+</button>

        <button class="zero" data-action="number">0</button>
        <button data-action="decimal">.</button>
        <button class="equal" data-action="calculate">=</button>
      </section>
    </main>

    <script>
      const expressionEl = document.getElementById("expression");
      const resultEl = document.getElementById("result");

      let currentInput = "0";
      let expression = "";
      let storedValue = null;
      let pendingOperator = null;
      let shouldResetInput = false;

      const updateDisplay = () => {
        expressionEl.textContent = expression;
        resultEl.textContent = currentInput;
      };

      const formatNumber = (value) => {
        const number = Number(value);
        if (Number.isNaN(number)) return "Ошибка";
        return Number.isInteger(number) ? number.toString() : number.toString();
      };

      const calculate = (first, second, operator) => {
        switch (operator) {
          case "+":
            return first + second;
          case "−":
            return first - second;
          case "×":
            return first * second;
          case "÷":
            return second === 0 ? NaN : first / second;
          default:
            return second;
        }
      };

      const appendNumber = (number) => {
        if (shouldResetInput) {
          currentInput = number;
          shouldResetInput = false;
          return;
        }

        if (currentInput === "0") {
          currentInput = number;
        } else {
          currentInput += number;
        }
      };

      const appendDecimal = () => {
        if (shouldResetInput) {
          currentInput = "0.";
          shouldResetInput = false;
          return;
        }

        if (!currentInput.includes(".")) {
          currentInput += ".";
        }
      };

      const handleOperator = (operatorSymbol) => {
        const inputValue = Number(currentInput);

        if (storedValue === null) {
          storedValue = inputValue;
        } else if (!shouldResetInput && pendingOperator) {
          storedValue = calculate(storedValue, inputValue, pendingOperator);
          currentInput = formatNumber(storedValue);
        }

        pendingOperator = operatorSymbol;
        expression = `${formatNumber(storedValue)} ${operatorSymbol}`;
        shouldResetInput = true;
      };

      const handlePercent = () => {
        const value = Number(currentInput);
        if (Number.isNaN(value)) return;
        currentInput = formatNumber(value / 100);
      };

      const handleDelete = () => {
        if (shouldResetInput) return;
        if (currentInput.length === 1) {
          currentInput = "0";
        } else {
          currentInput = currentInput.slice(0, -1);
        }
      };

      const handleClear = () => {
        currentInput = "0";
        expression = "";
        storedValue = null;
        pendingOperator = null;
        shouldResetInput = false;
      };

      const handleCalculate = () => {
        if (pendingOperator === null || storedValue === null) return;

        const inputValue = Number(currentInput);
        const result = calculate(storedValue, inputValue, pendingOperator);
        currentInput = formatNumber(result);
        expression = `${formatNumber(storedValue)} ${pendingOperator} ${formatNumber(inputValue)} =`;
        storedValue = result;
        pendingOperator = null;
        shouldResetInput = true;
      };

      document.querySelector(".keys").addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;

        const action = button.dataset.action;
        const value = button.textContent.trim();

        switch (action) {
          case "number":
            appendNumber(value);
            break;
          case "decimal":
            appendDecimal();
            break;
          case "operator":
            handleOperator(value);
            break;
          case "percent":
            handlePercent();
            break;
          case "delete":
            handleDelete();
            break;
          case "clear":
            handleClear();
            break;
          case "calculate":
            handleCalculate();
            break;
          default:
            break;
        }

        updateDisplay();
      });

      updateDisplay();
    </script>
  </body>
</html>
